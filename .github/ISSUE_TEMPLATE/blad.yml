name: Bug / Błąd
description: Something works wrong or not at all. / Coś działa źle albo wcale.
title: "[Bug] "
labels: [błąd]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened / Co się stało
      description: What you did, what you expected and what the app showed. English or Polish.
    validations:
      required: true
  - type: textarea
    id: screen
    attributes:
      label: Screenshot / Zrzut ekranu
      description: Drop a screenshot of the game with the overlay or of the app window here.
  - type: input
    id: version
    attributes:
      label: App version / Wersja aplikacji
      description: Shown next to the app name, e.g. 1.2.5.
  - type: input
    id: screen-size
    attributes:
      label: Screen resolution / Rozdzielczość ekranu
      placeholder: e.g. 1920×1080
