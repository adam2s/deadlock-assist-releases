name: Błąd
description: Coś działa źle albo wcale.
title: "[Błąd] "
labels: [błąd]
body:
  - type: textarea
    id: what
    attributes:
      label: Co się stało
      description: Co zrobiłeś, czego się spodziewałeś i co pokazała aplikacja.
    validations:
      required: true
  - type: textarea
    id: screen
    attributes:
      label: Zrzut ekranu
      description: Przeciągnij tu zrzut gry z nakładką albo okna aplikacji.
  - type: input
    id: version
    attributes:
      label: Wersja aplikacji
      description: Widać ją obok nazwy aplikacji, np. 1.2.5.
  - type: input
    id: screen-size
    attributes:
      label: Rozdzielczość ekranu
      placeholder: np. 1920×1080
