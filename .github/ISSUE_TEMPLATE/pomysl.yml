name: Idea / Pomysł
description: A new feature or a change in how something works. / Nowa funkcja albo zmiana działania.
title: "[Idea] "
labels: [pomysł]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would help / Co by się przydało
      description: English or Polish.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why / Po co
      description: In what situation in the game it would help.
  - type: input
    id: version
    attributes:
      label: App version / Wersja aplikacji
      description: Shown next to the app name, e.g. 1.2.5.
