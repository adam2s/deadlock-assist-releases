# TEMPORARY: fetches items.json on the work branch so the items pages can be checked before merge.
# Removed before the pull request is merged.
name: Items data preview

on:
  push:
    branches: [claude/project-thread-yxzc9n]
    paths: [".github/workflows/items-preview.yml", "site/items.py"]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Show API row shapes
        run: |
          since=$(( ($(date +%s) - 14*86400) / 86400 * 86400 ))
          curl -sS "https://api.deadlock-api.com/v1/analytics/item-stats?bucket=hero&min_average_badge=61&min_matches=1&min_unix_timestamp=$since" | head -c 600; echo
          curl -sS "https://api.deadlock-api.com/v1/analytics/hero-stats?min_average_badge=61&min_unix_timestamp=$since" | head -c 400; echo
      - name: Download items
        run: python3 -I site/items.py docs
      - name: Commit
        run: |
          git add site/items.json docs/img
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Items data preview ($(date -u +%F))"
          git push
