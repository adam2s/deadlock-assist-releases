# Refreshes the "Patche Deadlocka" / "Deadlock patch notes" pages every day: new patches show up a day after release.
name: Refresh patch notes pages

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/patches.py", ".github/workflows/patches.yml"]

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-counters  # shares the queue with the counter pages: both commit docs/
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start from the newest main
        # A queued run starts after the other refresh workflow pushed: build on its commit, not on the stale one.
        run: git fetch --depth=1 origin main && git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download patches and icons
        run: python3 -I site/patches.py docs
      - name: Build the site
        run: python3 -I site/build.py docs
      - name: Commit if anything changed
        id: commit
        run: |
          git add site/patches.json site/patch-notes docs
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Site: refresh patch notes pages ($(date -u +%F))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
