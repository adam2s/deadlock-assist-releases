<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 – Deadlock Assist</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://adam2s.github.io/deadlock-assist-releases/favicon-32.png">
<style>:root{--bg:#0e1014;--panel:#171a21;--panel-2:#1f232c;--border:#262b35;--border-strong:#343a46;--text:#e8eaed;--text-2:#cfd5df;--muted:#9aa3b2;--accent:#f2a33a;--gold:#f2c94c;--on-accent:#14161a;--vitality:#57c46a;--r:10px;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--text);font:100%/1.6 Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:var(--accent)}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:6px}
.skip:focus{left:16px;z-index:10}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,summary{text-wrap:balance}
p,li,figcaption{text-wrap:pretty}
h1{margin:0;font-size:clamp(32px,4vw,48px);line-height:1.08;letter-spacing:-.025em;font-weight:800}
h2{margin:0 0 8px;font-size:clamp(26px,3vw,34px);line-height:1.2;letter-spacing:-.015em}
h3{margin:0 0 6px;font-size:19px;line-height:1.3;letter-spacing:-.005em}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.logo span{color:var(--accent)}
.logo img{border-radius:8px}
.top nav{display:flex;gap:4px;align-items:center}
.top nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px;font-size:14px}
.top nav a:hover{color:var(--text);background:var(--panel)}
.top nav .lang{border:1px solid var(--border-strong);color:var(--text)}
.top nav .btn.sm{display:none}
.top nav .short{display:none}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center;padding:32px 0 64px}
.eyebrow{margin:0 0 14px;color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.lead{margin:20px 0 16px;font-size:18px;color:var(--text-2);max-width:46ch}
.proof-line{margin:0 0 24px}
.proof-line a{display:inline-flex;align-items:baseline;gap:8px;color:var(--text-2);text-decoration:none;font-size:15px;padding:6px 12px;border-radius:12px;background:rgba(242,163,58,.1);border:1px solid rgba(242,163,58,.3)}
.proof-line strong{color:var(--accent);font-variant-numeric:tabular-nums}
.proof-line a:hover{border-color:var(--accent)}
.section-lead{margin:0 0 24px;color:var(--muted);max-width:68ch}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.actions.center{justify-content:center}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border-radius:var(--r);background:var(--accent);color:var(--on-accent);font-weight:700;text-decoration:none;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn .ico{width:20px;height:20px;color:inherit;margin:0}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border-strong)}
.btn.kofi{background:transparent;color:var(--gold);border:1px solid rgba(242,201,76,.45)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.note{margin:12px 0 0;color:var(--muted);font-size:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:20px 0 0}
.badges li{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--panel-2);color:var(--text-2)}
.badges li::before{content:"✓ ";color:var(--vitality);font-weight:700}
.hero-shot{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:0 30px 80px -40px rgba(242,163,58,.4)}
section{padding:64px 0 0}
main>section:last-child{padding-bottom:72px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.card p{margin:0;color:var(--muted);font-size:15px}
.ico{width:28px;height:28px;color:var(--accent);margin-bottom:12px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
.gallery figure{margin:0}
.gallery a{display:block;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);background:var(--panel);transition:border-color .15s}
.gallery a:hover{border-color:var(--accent)}
.gallery img{aspect-ratio:842/527;object-fit:cover;object-position:top;width:100%}
figcaption{margin-top:10px;color:var(--text-2);font-size:15px}
.stats{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stat{display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(242,163,58,.07),transparent 55%),var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.stat p{margin:0;color:var(--muted);font-size:15px}
.stat .stat-num,.stat-num{color:var(--accent);font-size:clamp(32px,3.6vw,42px);font-weight:800;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums lining-nums;margin:0}
.stat .stat-label{color:var(--text);font-weight:600;margin:4px 0 14px}
.meter{position:relative;height:8px;border-radius:4px;background:var(--panel-2)}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.meter b{position:absolute;top:-5px;width:3px;height:18px;margin-left:-1px;border-radius:2px;background:#fff}
.meter-legend{position:relative;height:18px;margin:6px 0 12px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
.meter-legend span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.safe{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--vitality);border-radius:16px;padding:32px 40px}
.safe h2{display:flex;align-items:center;gap:12px}
.safe h2 .ico{margin:0;color:var(--vitality)}
.checks{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px 32px}
.checks li{padding-left:28px;position:relative;color:var(--text-2)}
.checks li::before{content:"✓";position:absolute;left:0;color:var(--vitality);font-weight:800}
.steps{list-style:none;padding:0;margin:24px 0 0;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;counter-reset:s}
.steps li{counter-increment:s;border-top:2px solid var(--border-strong);padding:20px 0 0}
.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;margin-bottom:12px}
.steps p{margin:0;color:var(--muted);font-size:15px}
.faq{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:24px;align-items:start}
details{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:0 20px}
summary{cursor:pointer;font-weight:600;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:22px;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:0 0 18px;color:var(--muted)}
.final{text-align:center}
.final .section-lead{margin-inline:auto}
.final .btn:first-child{min-height:56px;padding:0 30px;font-size:17px}
.foot{border-top:1px solid var(--border);padding:28px 0 48px;color:var(--muted);font-size:13px}
.foot nav{display:flex;flex-wrap:wrap;gap:0 20px;margin-bottom:8px}
.foot nav a{padding:6px 0}
.foot p{max-width:72ch;margin:8px 0 0}
.foot a{color:var(--text-2);text-decoration:none}
.foot a:hover{color:var(--accent)}
@media (max-width:860px){
.hero{grid-template-columns:1fr;gap:32px;padding-top:8px}
h1{line-height:1.15}
.grid,.stats,.gallery,.faq{grid-template-columns:1fr 1fr}
.steps,.checks{grid-template-columns:1fr}
.safe{padding:24px}
.top nav a:not(.lang):not(.sm){display:none}
.top nav .long{display:none}.top nav .short{display:inline}
.logo{font-size:15px;letter-spacing:.04em}
.top nav .btn.sm{display:inline-flex;color:var(--on-accent);background:var(--accent)}
.top nav .btn.sm:hover{background:var(--accent)}
}
@media (max-width:600px){
.grid,.stats,.gallery,.faq{grid-template-columns:1fr}
section{padding-top:48px}
}
</style>
</head>
<body>
<main class="wrap final" style="padding:96px 0">
  <p class="stat-num">404</p>
  <h1>Nie ma takiej strony · Page not found</h1>
  <div class="actions center" style="margin-top:28px"><p><a class="btn" href="https://adam2s.github.io/deadlock-assist-releases/">Wróć na stronę główną</a></p><p><a class="btn" href="https://adam2s.github.io/deadlock-assist-releases/en/">Back to the home page</a></p></div>
</main>
</body>
</html>
